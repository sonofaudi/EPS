<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Gate | KASU Proctoring</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/session.css">
    <script src="../js/auth/verify.js" defer></script>
</head>
<body>

    <div class="verification-container" style="max-width: 750px;">
        <header class="brand-header">
            <h1>Identity Verification Gate</h1>
            <p id="session-badge">Session Token: Checking...</p>
        </header>

        <main>
            <div id="status-error-box" class="feedback error" style="display: none; margin-bottom: 20px; text-align: left; font-size: 14px;"></div>

            <div class="verification-grid" style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
                
                <div class="camera-viewport" style="width: 100%; max-width: 480px; height: 360px; background-color: #111; border-radius: 8px; overflow: hidden; position: relative; border: 3px solid #ddd;">
                    <video id="webcam-feed" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                    <div id="camera-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 14px; background: rgba(0,0,0,0.85);">
                        🔒 Camera Off - Access Authorization Pending
                    </div>
                </div>

                <div id="identity-card" class="form-instruction" style="width: 100%; display: none;">
                    <h3 style="margin-top: 0; color: #0b5936;">Candidate Information Profile</h3>
                    <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                    <p style="margin: 5px 0;"><strong>Full Name:</strong> <span id="lbl-name">-</span></p>
                    <p style="margin: 5px 0;"><strong>Matric Number:</strong> <span id="lbl-matric">-</span></p>
                    <p style="margin: 5px 0;"><strong>Academic Unit:</strong> <span id="lbl-dept">-</span> (<span id="lbl-level"></span>)</p>
                    <p style="margin: 5px 0;"><strong>Target Assessment:</strong> <span id="lbl-exam">-</span></p>
                </div>

                <button type="button" id="initiate-capture-btn" class="btn-continue" style="width: 100%; max-width: 480px;" disabled>
                    Awaiting System Diagnostics...
                </button>
            </div>
        </main>
    </div>

</body>
</html>
