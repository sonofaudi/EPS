<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification | KASU Proctoring</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/auth/login.js" defer></script>
</head>
<body>

        <div class="verification-container">
        
        <header class="brand-header">
            <img src="../assets/logo.png" alt="KASU Logo" width="80" onerror="this.style.display='none'">
            <h1>Examination Proctoring System</h1>
            <h2>Candidate Verification</h2>
        </header>

        <main>
            <p class="form-instruction">
                Please enter your examination details exactly as they appear on the official examination register.
            </p>

            <div id="server-error">❌ Record not found. Please verify your details or contact the administrator.</div>

            <form id="verificationForm" onsubmit="handleVerification(event)">
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@domain.com" autocomplete="off">
                    <div id="email-feedback" class="feedback"></div>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g., John Musa" autocomplete="off">
                    <div id="fullName-feedback" class="feedback"></div>
                </div>

                <div class="form-group">
                    <label for="matricNumber">Matric Number</label>
                    <input type="text" id="matricNumber" placeholder="KASU/22/CSC/1125" autocomplete="off">
                    <div id="matricNumber-feedback" class="feedback"></div>
                </div>

                <button type="submit" id="continueBtn" class="btn-continue" disabled>Continue</button>
            </form>
        </main>
    </div>

    <footer>
        &copy; Kaduna State University<br>
        Examination Proctoring System<br>
        Version 1.0
    </footer>

</body>
</html>
