
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASU EPS - Admin Integrity Monitor</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

   <div class="header">
        <h1>KASU EPS — Integrity Incident Monitor</h1>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn-view" onclick="fetchViolations()">Refresh Feed</button>
            <button class="btn-view" style="background: linear-gradient(135deg,  #f42c2c 100%);" onclick="handleAdminLogout()">Logout</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Total Recorded Violations</div>
            <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="label">High/Critical Flags</div>
            <div class="value" style="color: var(--accent-red);" id="statHigh">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Flagged Candidates</div>
            <div class="value" style="color: var(--accent-yellow);" id="statCandidates">0</div>
        </div>
    </div>

    <div class="filters">
        <select id="severityFilter" onchange="fetchViolations()">
            <option value="">All Severities</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>

        <select id="typeFilter" onchange="fetchViolations()">
            <option value="">All Event Types</option>
            <option value="face_missing">Face Missing</option>
            <option value="multiple_faces">Multiple Faces</option>
            <option value="unauthorized_object">Unauthorized Object</option>
            <option value="tab_switch">Tab Switch</option>
            <option value="window_blur">Window Blur</option>
            <option value="screen_share_ended">Screen Share Terminated</option>
        </select>
    </div>

    <table class="violations-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Candidate ID</th>
                <th>Event Type</th>
                <th>Severity</th>
                <th>Details</th>
                <th>Evidence Snapshot</th>
            </tr>
        </thead>
        <tbody id="violationsTableBody">
            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading live violation records...</td></tr>
        </tbody>
    </table>

    <!-- Evidence Modal -->
    <div class="modal" id="evidenceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Evidence Snapshot</h3>
                <span class="close-btn" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="Violation Screenshot Evidence">
                <p id="modalDesc" style="margin-top: 12px; font-size: 0.85rem; color: var(--text-muted);"></p>
            </div>
        </div>
    </div>

  <script src="../js/admin/dashboard.js"></script>
</body>
</html>
